name: Expand Caja Negra Lab snapshot

on:
  push:
    paths:
      - 'Caja Negra Lab/.expand-request'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand snapshot with UTF-8 filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          zip_path = Path('Caja Negra Lab/Caja_Negra_Lab_snapshot.zip')
          root = Path('.')

          if not zip_path.exists():
              raise SystemExit('Snapshot ZIP not found')

          with zipfile.ZipFile(zip_path) as z:
              for info in z.infolist():
                  raw_name = info.filename
                  try:
                      fixed_name = raw_name.encode('cp437').decode('utf-8')
                  except Exception:
                      fixed_name = raw_name

                  target = root / fixed_name
                  if fixed_name.endswith('/'):
                      target.mkdir(parents=True, exist_ok=True)
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))

          zip_path.unlink()
          marker = Path('Caja Negra Lab/.expand-request')
          if marker.exists():
              marker.unlink()
          PY

      - name: Commit expanded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Expand Caja Negra Lab snapshot"
            git push
          fi
