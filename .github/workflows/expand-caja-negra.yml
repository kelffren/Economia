name: Expand Caja Negra Lab snapshot

on:
  push:
    paths:
      - 'Caja Negra Lab/.expand-request'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and expand Caja Negra Lab
        run: |
          set -euo pipefail
          cat .tmp/caja-negra/chunk*.b64 | base64 --decode > /tmp/caja-negra.tar.gz
          tar -xzf /tmp/caja-negra.tar.gz -C .
          rm -rf .tmp/caja-negra
          rm -f 'Caja Negra Lab/Caja_Negra_Lab_snapshot.zip'
          rm -f 'Caja Negra Lab/.expand-request'

      - name: Commit expanded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Expand Caja Negra Lab snapshot"
            git push
          fi
